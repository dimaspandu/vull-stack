<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="404 — Page not found"
  >

  <title>404 — Page not found</title>

  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/assets/css/stories.css">
</head>

<body>
  <main class="story-detail-page" id="outlet">
    <div class="story-detail-page__container">

      <nav
        class="story-detail-page__navigation"
        aria-label="Story navigation"
      >
        <a
          class="story-detail-page__back"
          href="/"
          data-link
        >
          ← Back to stories
        </a>
      </nav>

      <div class="story-alert" role="alert">
        <div class="story-alert__icon" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 8v4" />
            <path d="M12 16h.01" />
          </svg>
        </div>

        <div class="story-alert__content">
          <h1 class="story-alert__title">
            404 — Page not found
          </h1>

          <p class="story-alert__description">
            The page you are looking for does not exist or has been moved.
          </p>

          <a
            class="story-alert__link"
            href="/"
            data-link
          >
            ← Back to stories
          </a>
        </div>
      </div>

    </div>
  </main>

  <portal id="portal"></portal>

  <script type="module" src="/assets/js/index.js"></script>
</body>
</html>
